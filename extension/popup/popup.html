<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobTracker AI Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
        </div>
        <div>
          <h1 class="title">JobTracker AI</h1>
          <p class="subtitle">Extractor de Vacantes</p>
        </div>
      </div>
      <div class="header-badges">
        <span id="portal-badge" class="badge badge-portal">Detectando...</span>
        <span id="sync-badge" class="badge badge-sync" title="Estado de conexión con JobTracker">● Sincronizado</span>
      </div>
    </header>

    <!-- Quick Action / Manual Activation Banner -->
    <div id="quick-action-bar" class="quick-action-bar">
      <div class="quick-action-info">
        <span class="quick-action-icon">⚡</span>
        <span id="quick-action-text" class="quick-action-text">Widget flotante en página</span>
      </div>
      <button type="button" id="toggle-floating-btn" class="btn-sm-action">
        Mostrar Widget
      </button>
    </div>

    <!-- Main Content -->
    <div id="loading-state" class="state-container">
      <div class="spinner"></div>
      <p>Extrayendo datos de la vacante...</p>
    </div>

    <div id="form-state" class="form-container" style="display: none;">
      <!-- Job Title & Company -->
      <div class="form-group">
        <label for="job-title">Título del Puesto *</label>
        <input type="text" id="job-title" placeholder="Ej: Senior React Developer" required>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label for="job-company">Empresa *</label>
          <input type="text" id="job-company" placeholder="Ej: TechCorp" required>
        </div>
        <div class="form-group flex-1">
          <label for="job-work-mode">Modalidad</label>
          <select id="job-work-mode">
            <option value="Remoto">100% Remoto</option>
            <option value="Híbrido">Híbrido</option>
            <option value="Presencial">Presencial</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label for="job-location">Ubicación / País</label>
          <input type="text" id="job-location" placeholder="Ej: Remoto (LATAM / Global)">
        </div>
        <div class="form-group flex-1">
          <label for="job-salary">Rango Salarial</label>
          <input type="text" id="job-salary" placeholder="Ej: $3,000 - $4,500 USD">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label for="job-status">Estado</label>
          <select id="job-status">
            <option value="wishlist">Por Aplicar (Wishlist)</option>
            <option value="applied">Postulado (Applied)</option>
            <option value="interview">En Entrevista</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label for="job-priority">Prioridad</label>
          <select id="job-priority">
            <option value="high">Alta ⭐⭐⭐</option>
            <option value="medium" selected>Media ⭐⭐</option>
            <option value="low">Baja ⭐</option>
          </select>
        </div>
      </div>

      <!-- Detected Tech Stack -->
      <div class="form-group">
        <label for="job-tech">Stack / Tecnologías Detectadas</label>
        <input type="text" id="job-tech" placeholder="React, TypeScript, Node.js, AWS...">
      </div>

      <!-- Recruiter & Contact Info -->
      <div class="form-row">
        <div class="form-group flex-1">
          <label for="job-recruiter">Contacto / Reclutador</label>
          <input type="text" id="job-recruiter" placeholder="Nombre o LinkedIn">
        </div>
        <div class="form-group flex-1">
          <label for="job-email">Email de Contacto</label>
          <input type="email" id="job-email" placeholder="hr@empresa.com">
        </div>
      </div>

      <!-- Job Description (collapsible) -->
      <div class="form-group">
        <div class="desc-header">
          <label for="job-description">Descripción de la Oferta</label>
          <button type="button" id="toggle-desc-btn" class="btn-text">Ver / Editar</button>
        </div>
        <textarea id="job-description" rows="3" placeholder="Requisitos, responsabilidades y detalles de la vacante..."></textarea>
      </div>

      <!-- Action Buttons -->
      <div class="actions-container">
        <button type="button" id="save-btn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Guardar en JobTracker
        </button>

        <button type="button" id="optimize-btn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
          Guardar y Optimizar CV
        </button>
      </div>

      <!-- Widget Settings Selector -->
      <div class="widget-config-card">
        <div class="widget-config-header">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <label for="widget-mode-select" class="config-label">Aparición del Widget Flotante:</label>
        </div>
        <select id="widget-mode-select" class="config-select">
          <option value="job_portals_only">🎯 Solo en portales de empleo (Recomendado)</option>
          <option value="manual">✋ Solo manual (bajo demanda)</option>
          <option value="always">🌐 En todas las páginas</option>
        </select>
      </div>

      <div class="footer-links">
        <button type="button" id="copy-json-btn" class="link-btn">📋 Copiar JSON</button>
        <span class="sep">•</span>
        <button type="button" id="open-app-btn" class="link-btn">🌐 Abrir JobTracker</button>
      </div>
    </div>

    <!-- Success / Error Status Banner -->
    <div id="status-msg" class="status-banner" style="display: none;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
